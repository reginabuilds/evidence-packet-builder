  <text x="70" y="180" font-family="Arial" font-size="13" font-weight="700" fill="#657065">GEOSPATIAL COMPARISON</text>
  <text x="70" y="207" font-family="Arial" font-size="18" font-weight="700" fill="#172018">Official representation vs. observed trips</text>
