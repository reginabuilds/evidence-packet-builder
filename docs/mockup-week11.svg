<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Agua a Tiempo MX app mockup</title><desc id="desc">Generated interface mockup showing an editable household water reserve estimate and a clearly simulated supply notice.</desc>
<rect width="1200" height="900" fill="#f4f8f7"/><rect x="70" y="45" width="1060" height="810" rx="28" fill="#fff" stroke="#dce9e6" stroke-width="2"/>
<rect x="100" y="65" width="46" height="46" rx="15" fill="#0b6b67"/><text x="123" y="96" font-size="29" font-family="Arial" text-anchor="middle" fill="#fff">≈</text><text x="163" y="84" font-size="23" font-weight="700" font-family="Arial" fill="#153a40">Agua a Tiempo MX</text><text x="163" y="106" font-size="14" font-family="Arial" fill="#5c7478">Preparación del hogar · información clara</text><rect x="865" y="72" width="230" height="34" rx="17" fill="#fff4d7" stroke="#f0d99c"/><text x="980" y="94" font-size="12" font-weight="700" text-anchor="middle" font-family="Arial" fill="#77500b">DEMO CON DATOS SIMULADOS</text>
<rect x="100" y="155" width="1000" height="190" rx="23" fill="#0b6b67"/><text x="135" y="196" font-size="13" font-weight="700" letter-spacing="2" font-family="Arial" fill="#d8efeb">TU CASA · TU RESERVA</text><text x="135" y="242" font-size="34" font-weight="700" font-family="Arial" fill="#fff">Prepárate con lo que sabes.</text><text x="135" y="282" font-size="34" font-weight="700" font-family="Arial" fill="#fff">No con promesas.</text><text x="135" y="316" font-size="16" font-family="Arial" fill="#e2f3f1">Registra una estimación y consulta el estado de los avisos.</text><rect x="760" y="185" width="300" height="125" rx="17" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".4"/><text x="785" y="214" font-size="12" font-family="Arial" fill="#d8efeb">RESERVA ORIENTATIVA ACTUAL</text><text x="785" y="255" font-size="34" font-weight="700" font-family="Arial" fill="#fff">420 litros</text><text x="785" y="283" font-size="14" font-family="Arial" fill="#e2f3f1">≈ 2 días · cálculo orientativo</text>
<rect x="100" y="372" width="200" height="42" rx="12" fill="#0b6b67"/><text x="200" y="398" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial" fill="#fff">Mi reserva</text><rect x="312" y="372" width="230" height="42" rx="12" fill="#fff" stroke="#dce9e6"/><text x="427" y="398" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial" fill="#5c7478">Avisos de suministro</text><rect x="554" y="372" width="170" height="42" rx="12" fill="#fff" stroke="#dce9e6"/><text x="639" y="398" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial" fill="#5c7478">Preparación</text>
<rect x="100" y="437" width="485" height="350" rx="20" fill="#fff" stroke="#dce9e6" stroke-width="2"/><text x="130" y="477" font-size="22" font-weight="700" font-family="Arial" fill="#153a40">Registro de reserva</text><text x="130" y="502" font-size="14" font-family="Arial" fill="#5c7478">Lectura manual y editable; no es certificada.</text><text x="130" y="542" font-size="14" font-weight="700" font-family="Arial" fill="#153a40">Litros estimados</text><rect x="130" y="553" width="200" height="52" rx="10" fill="#fff" stroke="#cbdcd8"/><text x="150" y="585" font-size="19" font-family="Arial" fill="#153a40">420 L</text><text x="350" y="542" font-size="14" font-weight="700" font-family="Arial" fill="#153a40">Personas en casa</text><rect x="350" y="553" width="200" height="52" rx="10" fill="#fff" stroke="#cbdcd8"/><text x="370" y="585" font-size="19" font-family="Arial" fill="#153a40">3 personas</text><rect x="130" y="625" width="425" height="105" rx="14" fill="#eef8f5"/><rect x="150" y="644" width="160" height="24" rx="7" fill="#dff3ef"/><text x="230" y="660" font-size="11" font-weight="700" text-anchor="middle" font-family="Arial" fill="#0b6b67">ESTIMACIÓN MANUAL</text><text x="150" y="694" font-size="14" font-family="Arial" fill="#5c7478">Reserva para necesidades básicas</text><text x="525" y="681" font-size="25" font-weight="700" text-anchor="end" font-family="Arial" fill="#153a40">2.0 días</text><text x="525" y="704" font-size="12" text-anchor="end" font-family="Arial" fill="#5c7478">70 L/persona/día</text>
<rect x="605" y="437" width="495" height="350" rx="20" fill="#fff" stroke="#dce9e6" stroke-width="2"/><text x="635" y="477" font-size="22" font-weight="700" font-family="Arial" fill="#153a40">Aviso de suministro</text><text x="635" y="502" font-size="14" font-family="Arial" fill="#5c7478">Verifica quién confirma y cuándo se actualizó.</text><rect x="635" y="528" width="190" height="26" rx="7" fill="#fff4d7"/><text x="730" y="545" font-size="11" font-weight="700" text-anchor="middle" font-family="Arial" fill="#8a5b09">SIMULACIÓN PARA DEMO</text><text x="635" y="585" font-size="18" font-weight="700" font-family="Arial" fill="#153a40">Corte programado</text><text x="635" y="611" font-size="16" font-family="Arial" fill="#8a5b09">Pendiente de confirmación oficial</text><text x="635" y="645" font-size="14" font-family="Arial" fill="#5c7478">Aviso ficticio para probar el flujo.</text><text x="635" y="665" font-size="14" font-family="Arial" fill="#5c7478">No representa una interrupción real.</text><path d="M635 690h430" stroke="#dce9e6"/><text x="635" y="715" font-size="12" font-family="Arial" fill="#5c7478">FUENTE</text><text x="635" y="735" font-size="14" font-weight="700" font-family="Arial" fill="#153a40">Ejemplo no oficial</text><text x="855" y="715" font-size="12" font-family="Arial" fill="#5c7478">SIGUIENTE ACTUALIZACIÓN</text><text x="855" y="735" font-size="14" font-weight="700" font-family="Arial" fill="#153a40">Por confirmar</text><text x="600" y="826" font-size="13" text-anchor="middle" font-family="Arial" fill="#5c7478">Mockup SVG · Sin conexión a servicios oficiales ni envío de avisos</text></svg>