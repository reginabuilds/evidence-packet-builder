<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect width="390" height="844" fill="#f5f4ee"/><rect width="390" height="116" fill="#173d3b"/><text x="22" y="45" font-family="Arial" font-size="22" font-weight="bold" fill="#fff">Agua a Tiempo MX</text><text x="22" y="70" font-family="Arial" font-size="12" fill="#d7e8e1">Prepárate con información clara</text><rect x="16" y="132" width="358" height="58" rx="12" fill="#fff1d4" stroke="#d9b86b"/><text x="28" y="155" font-family="Arial" font-size="11" font-weight="bold" fill="#624b16">DEMO ACADÉMICA · DATOS SIMULADOS</text><text x="28" y="173" font-family="Arial" font-size="10" fill="#624b16">No es un aviso oficial ni una medición real.</text><rect x="16" y="205" width="358" height="190" rx="16" fill="#fffefa" stroke="#d9e2dc"/><text x="32" y="235" font-family="Arial" font-size="13" fill="#216a61">REGISTRO DEL HOGAR</text><text x="32" y="262" font-family="Arial" font-size="18" font-weight="bold" fill="#173d3b">Mi reserva estimada</text><text x="32" y="310" font-family="Arial" font-size="38" font-weight="bold" fill="#173d3b">— L</text><text x="32" y="333" font-family="Arial" font-size="12" fill="#647775">Agrega una lectura para comenzar.</text><rect x="32" y="350" width="326" height="32" rx="8" fill="#216a61"/><text x="195" y="371" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Registrar lectura</text><rect x="16" y="410" width="358" height="145" rx="16" fill="#fffefa" stroke="#d9e2dc"/><text x="32" y="440" font-family="Arial" font-size="13" fill="#216a61">COSTO TRANSPARENTE</text><text x="32" y="466" font-family="Arial" font-size="18" font-weight="bold" fill="#173d3b">Mis entregas de agua</text><text x="32" y="489" font-family="Arial" font-size="12" fill="#647775">Registra litros y costo total.</text><rect x="32" y="507" width="326" height="32" rx="8" fill="#216a61"/><text x="195" y="528" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Guardar entrega</text><rect x="16" y="570" width="358" height="154" rx="16" fill="#fffefa" stroke="#d9e2dc"/><text x="32" y="600" font-family="Arial" font-size="13" fill="#647775">AVISOS DE SUMINISTRO</text><text x="32" y="628" font-family="Arial" font-size="17" font-weight="bold" fill="#173d3b">Ejemplo de interrupción</text><rect x="32" y="642" width="178" height="23" rx="5" fill="#fff1d4"/><text x="40" y="657" font-family="Arial" font-size="10" font-weight="bold" fill="#674c0e">DEMO — NO ES AVISO REAL</text><text x="32" y="686" font-family="Arial" font-size="12" fill="#647775">Estado: no confirmado · Fuente: ejemplo</text><text x="32" y="705" font-family="Arial" font-size="12" fill="#647775">Sin promesa de restablecimiento.</text><text x="20" y="770" font-family="Arial" font-size="12" fill="#647775">Tus registros permanecen en esta sesión.</text><text x="20" y="790" font-family="Arial" font-size="12" fill="#647775">No hay sensores conectados ni cortes en vivo.</text></svg>